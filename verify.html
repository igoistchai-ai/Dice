<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>x1ro Dice — Verify</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}body{background:#090304;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 82%,rgba(255,47,0,.55),transparent 42%),linear-gradient(180deg,#030304,#1b0507 62%,#080304)}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(145deg,transparent 45%,rgba(255,30,0,.12) 50%,transparent 55%),linear-gradient(35deg,transparent 45%,rgba(255,30,0,.1) 50%,transparent 55%);opacity:.8}
.wrap{width:min(700px,94vw);margin:auto;padding:35px 0 60px}.logo{text-align:center;font-size:34px;font-weight:1000;text-shadow:0 4px 14px #000}.logo b{color:#ff3037}.sub{text-align:center;margin-top:7px;font-size:10px;letter-spacing:3px;color:#d8caca}
.card{margin-top:25px;padding:18px;border:2px solid #762329;border-radius:12px;background:linear-gradient(180deg,rgba(65,13,18,.97),rgba(27,5,8,.98));box-shadow:0 20px 60px #000,inset 0 0 30px rgba(255,40,40,.07)}
.label{text-align:center;font-size:12px;font-weight:1000;text-transform:uppercase;margin-bottom:9px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;height:42px;border:0;border-radius:5px;padding:0 12px;font-weight:900;font-size:13px;outline:none}.search button{height:42px;border:0;border-radius:5px;padding:0 18px;background:linear-gradient(#fff21a,#f0cc00);color:#fff;font-weight:1000;text-shadow:0 2px 2px #765900;cursor:pointer}.search button:active{transform:translateY(2px)}
.status{text-align:center;min-height:22px;padding-top:12px;font-size:10px;color:#e8d0d0}.dice{min-height:130px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:22px 8px}.die{width:70px;height:70px;border:3px solid #fff;border-radius:10px;background:var(--c);position:relative;box-shadow:0 4px 13px #000,0 0 15px var(--c);animation:appear .5s cubic-bezier(.15,1.3,.3,1) both}.dot{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 1px 2px #777}.d1{left:50%;top:50%;transform:translate(-50%,-50%)}.d2{left:18%;top:18%}.d3{right:18%;bottom:18%}.d4{right:18%;top:18%}.d5{left:18%;bottom:18%}.d6{left:18%;top:50%;transform:translateY(-50%)}.d7{right:18%;top:50%;transform:translateY(-50%)}
@keyframes appear{from{opacity:0;transform:translateY(16px) scale(.78)}65%{opacity:1;transform:translateY(-4px) scale(1.05)}to{opacity:1;transform:none}}
.back{display:block;text-align:center;color:#fff;margin-top:14px;font-size:11px;font-weight:900;text-decoration:underline;cursor:pointer}.error{color:#ff9999}.hint{font-size:8px;text-align:center;color:#bba7a7;margin-top:12px;line-height:15px}
@media(max-width:500px){.search{flex-direction:column}.search button{width:100%}.die{width:58px;height:58px}}
</style></head><body>
<div class="wrap"><div class="logo"><b>x1ro</b> DICE</div><div class="sub">DICE VERIFICATION</div><div class="card">
<div class="label">Enter Game ID</div><div class="search"><input id="id" autocomplete="off" placeholder="Example: QVRK9xDiceVIP"><button id="verify">VERIFY DICE</button></div><div class="status" id="status">Enter an ID to see the recorded dice.</div><div class="dice" id="dice" aria-live="polite"></div><a class="back" href="index.html">← BACK TO x1ro DICE</a><div class="hint">This front-end reads rolls saved on the same site/browser. For truly global verification of any player, connect the lookup to your server/API.</div>
</div></div>
<script>
'use strict';
const COLORS={yellow:'#ffd400',orange:'#ff7900',red:'#ff1717',purple:'#8f10c7',green:'#18b83d',blue:'#168cff',pink:'#ef42a5',cyan:'#13cee8'};
const pos={1:[1],2:[2,3],3:[2,1,3],4:[2,4,5,3],5:[2,4,1,5,3],6:[2,4,6,7,5,3]};
const $=id=>document.getElementById(id);
function die(color,value,i){const d=document.createElement('div');d.className='die';d.style.setProperty('--c',COLORS[color]||color||'#fff');d.style.animationDelay=(i*70)+'ms';(pos[value]||[1]).forEach(n=>{const x=document.createElement('i');x.className='dot d'+n;d.appendChild(x)});return d}
async function lookup(id){
 try{const r=await fetch('/api/dice/'+encodeURIComponent(id),{cache:'no-store'});if(r.ok){const data=await r.json();if(data&&data.results)return data}catch(_){}
 try{const db=JSON.parse(localStorage.getItem('x1roDiceRegistry')||'{}');return db[id]||null}catch(_){return null}
}
async function verify(){const id=$('id').value.trim();$('dice').innerHTML='';if(!id){$('status').textContent='Enter a Game ID.';return}$('status').textContent='Checking…';const entry=await lookup(id);if(!entry){$('status').className='status error';$('status').textContent='No dice result found for this ID.';return}$('status').className='status';$('status').textContent='Verified result • '+(entry.time||'');entry.results.forEach((r,i)=>$('dice').appendChild(die(r.color,r.value,i)))}
$('verify').addEventListener('click',verify);$('id').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});
const q=new URLSearchParams(location.search).get('id');if(q){$('id').value=q;verify()}
</script></body></html>
