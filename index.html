<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#180305">
<meta name="description" content="x1ro Dice — online color dice">
<title>x1ro Dice</title>
<style>
:root{
 --bg:#090103;--panel:#36090d;--panel2:#210609;--red:#e52a31;--red2:#ff454b;
 --line:rgba(255,150,150,.55);--white:#fff;--muted:#d9c8c8;--gold:#ffe100;
 --shadow:0 10px 30px rgba(0,0,0,.65);--radius:10px;
}
*{box-sizing:border-box}
html{min-height:100%;background:#080102}
body{margin:0;min-height:100vh;color:#fff;font-family:Arial,Helvetica,sans-serif;background:#0b0103;overflow-x:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ============================================================
   BACKGROUND — dense CSS-only volcanic/hellscape scene
   ============================================================ */
body{
 background:
 radial-gradient(ellipse at 50% 83%,rgba(255,61,0,.38),transparent 28%),
 radial-gradient(ellipse at 15% 80%,rgba(255,39,0,.22),transparent 27%),
 radial-gradient(ellipse at 87% 76%,rgba(255,50,0,.22),transparent 25%),
 linear-gradient(180deg,#070102 0%,#1a0306 42%,#330708 70%,#0a0102 100%);
}
body:before{
 content:"";position:fixed;inset:0;z-index:-10;pointer-events:none;
 background:
 radial-gradient(circle at 5% 17%,rgba(255,75,30,.9) 0 1px,transparent 2px),
 radial-gradient(circle at 17% 41%,rgba(255,90,30,.8) 0 1px,transparent 2px),
 radial-gradient(circle at 29% 19%,rgba(255,50,20,.75) 0 1px,transparent 2px),
 radial-gradient(circle at 48% 11%,rgba(255,90,40,.8) 0 1px,transparent 2px),
 radial-gradient(circle at 68% 29%,rgba(255,55,20,.7) 0 1px,transparent 2px),
 radial-gradient(circle at 83% 15%,rgba(255,90,30,.8) 0 1px,transparent 2px),
 radial-gradient(circle at 94% 39%,rgba(255,50,20,.75) 0 1px,transparent 2px);
 background-size:170px 160px,230px 220px,190px 200px,260px 180px,220px 230px,180px 190px,250px 210px;
 opacity:.8;
 animation:embersDrift 14s linear infinite;
}
body:after{
 content:"";position:fixed;inset:0;z-index:-9;pointer-events:none;
 background:
 linear-gradient(108deg,transparent 0 13%,rgba(255,35,0,.10) 14%,transparent 15% 31%,rgba(255,35,0,.08) 32%,transparent 33% 100%),
 linear-gradient(72deg,transparent 0 63%,rgba(255,35,0,.08) 64%,transparent 65%);
 mix-blend-mode:screen;
}
@keyframes embersDrift{from{transform:translateY(0)}to{transform:translateY(-90px)}}

.scene{position:fixed;inset:0;z-index:-8;overflow:hidden;pointer-events:none}
.sky-glow{position:absolute;left:50%;bottom:-25%;width:90vw;height:65vh;transform:translateX(-50%);
 background:radial-gradient(ellipse,rgba(255,73,0,.75),rgba(255,31,0,.18) 38%,transparent 72%);
 filter:blur(28px)}
.range{position:absolute;bottom:-3%;height:72%;width:62%;
 background:linear-gradient(150deg,#080506 0%,#180508 54%,#0a0203 100%);
 box-shadow:inset 0 -90px 100px rgba(255,35,0,.08);
 clip-path:polygon(0 100%,0 61%,5% 54%,11% 43%,17% 53%,23% 35%,30% 52%,38% 22%,45% 47%,52% 31%,60% 53%,68% 38%,75% 52%,83% 29%,90% 50%,100% 41%,100% 100%)}
.range.left{left:-11%}.range.right{right:-11%;transform:scaleX(-1)}
.river{position:absolute;bottom:-5%;height:58%;width:31%;
 background:linear-gradient(90deg,transparent 0 34%,rgba(255,30,0,.45) 39%,#ffb000 48%,#ff3300 52%,rgba(255,35,0,.28) 59%,transparent 66%);
 filter:blur(2px);opacity:.92;
 clip-path:polygon(45% 0,57% 0,60% 29%,69% 48%,100% 100%,0 100%,34% 58%,42% 30%)}
.river.left{left:6%}.river.right{right:6%;transform:scaleX(-1)}
.chain{position:absolute;top:-6%;width:7px;height:125%;background:repeating-linear-gradient(180deg,#080707 0 24px,#4d4b4b 25px 29px,#0a0909 30px 54px);
 border-radius:8px;opacity:.65;filter:drop-shadow(0 3px 3px #000)}
.chain.a{left:7%;transform:rotate(10deg)}.chain.b{right:9%;transform:rotate(-11deg)}
#embers{position:absolute;inset:0;overflow:hidden}
.ember{position:absolute;width:3px;height:7px;border-radius:50%;background:#ff6b22;box-shadow:0 0 9px #ff2d00;animation:emberRise var(--t) linear infinite;opacity:0}
@keyframes emberRise{0%{transform:translate3d(0,40px,0) scale(.5);opacity:0}12%{opacity:.9}100%{transform:translate3d(var(--dx),-105vh,0) scale(0);opacity:0}}

/* ============================================================
   PAGE + PANELS
   ============================================================ */
.page{width:min(1060px,96vw);margin:0 auto;padding:18px 0 34px;position:relative}
.header{height:93px;display:flex;align-items:center;justify-content:center;text-align:center}
.logo{font-weight:1000;font-size:32px;letter-spacing:-1.3px;line-height:1;text-shadow:0 4px 13px #000}
.logo .x{color:#ff252c}.logo .d{color:#fff}
.logo-line{width:310px;max-width:70vw;height:1px;margin:9px auto 5px;background:linear-gradient(90deg,transparent,#ff5555,transparent)}
.tagline{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:#eadede}
.layout{display:grid;grid-template-columns:190px minmax(380px,430px) 190px;gap:8px;align-items:start;justify-content:center}
.panel{
 background:linear-gradient(180deg,rgba(77,16,22,.95),rgba(39,8,12,.98));
 border:2px solid var(--line);border-radius:11px;box-shadow:var(--shadow),inset 0 0 28px rgba(255,38,45,.08);
}
.side{padding:8px 8px 10px;min-height:435px}
.side-title{font-size:11px;font-weight:1000;text-align:center;text-transform:uppercase;padding:5px 0 8px;
 border-bottom:1px solid rgba(255,255,255,.30);text-shadow:0 2px 3px #000}
.streamer{height:39px;margin-top:5px;padding:4px 5px;display:flex;align-items:center;gap:6px;
 border:1px solid rgba(255,150,150,.45);border-radius:7px;
 background:linear-gradient(180deg,rgba(144,43,50,.82),rgba(72,22,28,.88));
 box-shadow:inset 0 1px rgba(255,255,255,.08);transition:transform .2s,filter .2s}
.streamer:hover{transform:translateX(2px);filter:brightness(1.08)}
.avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid #ddd;
 background:radial-gradient(circle at 34% 28%,#f7f7f7,#888 42%,#222 73%);box-shadow:0 2px 5px #000}
.stream-info{min-width:0}.stream-name{font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream-tag{font-size:7.5px;color:#ddd;opacity:.82;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{margin-left:auto;font-size:7px;color:#ffb5b5;align-self:flex-start;padding-top:3px}

.trade-panel{padding:9px 7px 10px;min-height:0;background:linear-gradient(180deg,rgba(11,11,14,.97),rgba(4,4,6,.98));border-color:#090909}.trade-stack{display:flex;flex-direction:column;gap:8px}.trade-btn{height:64px;width:100%;border:3px solid #080808;border-radius:3px;display:flex;align-items:center;justify-content:center;gap:11px;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:1000;text-shadow:2px 2px #050505,0 0 3px #000;box-shadow:inset 0 2px rgba(255,255,255,.28),inset 0 -4px rgba(0,0,0,.20),0 2px 4px #000;cursor:pointer;transition:transform .12s,filter .16s}.trade-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.trade-btn:active{transform:translateY(2px)}.trade-icon{width:52px;text-align:center;font-size:33px;line-height:1;filter:drop-shadow(2px 2px #000)}.trade-btn.add{background:linear-gradient(#1978ed,#0755bd)}.trade-btn.deal{background:linear-gradient(#ffd51b,#e8ae00)}.trade-btn.ltrade{background:linear-gradient(#f52a2a,#ce0505)}.trade-btn.fair{background:linear-gradient(#24d34d,#05a82d)}.trade-btn.offer{background:linear-gradient(#752ee4,#4211a4)}.trade-btn.no{background:linear-gradient(#ff8a00,#ed5c00)}.trade-btn.fair .trade-icon{background:rgba(113,239,74,.75);border-radius:8px;padding:3px 4px}.empty-side{background:transparent;border-color:transparent;box-shadow:none;min-height:0}@media(max-width:850px){.trade-btn{height:53px;font-size:14px}.trade-icon{font-size:27px;width:42px}}
/* ============================================================
   CENTER — photo-like compact Online Dice structure
   ============================================================ */
.center{padding:9px 11px 10px;position:relative;min-height:500px;overflow:hidden}
.center:before{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,30,30,.06),transparent 30%,rgba(255,30,30,.03))}
.title{text-align:center;font-size:19px;font-weight:1000;text-transform:uppercase;margin:1px 0 9px;text-shadow:0 2px 3px #000}
.selects{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.select{height:29px;border:0;border-radius:3px;background:#fff;color:#222;padding:0 5px;font-size:10px;font-weight:900}
.dice-stage{min-height:82px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0 4px;position:relative}
.die{--die:#e74c3c;width:58px;height:58px;position:relative;border-radius:9px;background:var(--die);
 border:3px solid #fff;box-shadow:0 3px 9px #000,0 0 10px color-mix(in srgb,var(--die),transparent 35%);
 transition:transform .45s cubic-bezier(.2,1.35,.3,1),filter .35s,opacity .35s,box-shadow .35s;
 will-change:transform,filter,opacity}
.die:before{content:"";position:absolute;inset:4px;border-radius:6px;border:1px solid rgba(255,255,255,.38)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #777}
.d1{left:50%;top:50%;transform:translate(-50%,-50%)}.d2{left:18%;top:18%}.d3{right:18%;bottom:18%}
.d4{right:18%;top:18%}.d5{left:18%;bottom:18%}.d6{left:18%;top:50%;transform:translateY(-50%)}.d7{right:18%;top:50%;transform:translateY(-50%)}
.die.blur{filter:blur(1.25px)}.die.rolling{animation:diceJolt 1.45s cubic-bezier(.35,.05,.15,1) both}
@keyframes diceJolt{
  0%{transform:translateY(0) scale(1);filter:blur(0)}
  8%{transform:translateY(-3px) scale(1.01);filter:blur(1px)}
  20%{transform:translateY(4px) scale(.98);filter:blur(3px)}
  38%{transform:translateY(-2px) scale(1.02);filter:blur(5px)}
  58%{transform:translateY(3px) scale(.99);filter:blur(4px)}
  78%{transform:translateY(-1px) scale(1.01);filter:blur(2px)}
  100%{transform:none;filter:blur(0)}
}
.id{height:23px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:2px;margin:0 0 5px}
.history{height:30px;background:#fff;color:#1a2c58;border-radius:4px;display:flex;align-items:center;justify-content:center;
 font-size:10px;font-weight:900;text-decoration:underline;margin-bottom:6px;box-shadow:0 1px 3px #000}
.roll-btn{width:100%;height:35px;border:0;border-radius:3px;background:linear-gradient(#fff21a,#ffe000);
 color:#fff;font-size:15px;font-weight:1000;text-shadow:0 2px 2px rgba(0,0,0,.42);box-shadow:0 2px 0 #a17c00,0 0 12px rgba(255,224,0,.18);
 transition:transform .14s,filter .2s,box-shadow .2s}
.roll-btn:hover{filter:brightness(1.05);box-shadow:0 2px 0 #a17c00,0 0 20px rgba(255,224,0,.3)}
.roll-btn:active{transform:translateY(2px)}.roll-btn:disabled{opacity:.65;cursor:wait}

/* score exactly below roll, with the requested +/- controls */
.score-box{margin-top:4px;border:1px solid rgba(255,255,255,.27);background:rgba(70,16,21,.72);overflow:hidden}
.score-main{height:32px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center}
.score-side{font-size:8px;line-height:11px}.score-value{font-size:18px;font-weight:1000}
.score-controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:1px solid rgba(255,255,255,.18)}
.score-controls button{height:26px;border:0;border-right:1px solid rgba(255,255,255,.10);background:rgba(91,24,30,.9);color:#fff;font-size:9px;font-weight:1000;transition:background .18s,transform .1s}
.score-controls button:hover{background:#a9383f}.score-controls button:active{transform:scale(.95)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tool{height:27px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(255,255,255,.22);
 border-radius:4px;background:rgba(28,6,10,.68);font-size:8.5px;font-weight:900}
.tool input{accent-color:#ff3b42}
.colors{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.21)}
.colors-title{font-size:8.5px;font-weight:1000;text-transform:uppercase;margin-bottom:5px}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.color-choice{height:25px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px;
 border:1px solid rgba(255,255,255,.28);background:rgba(65,15,20,.8);font-size:7px;font-weight:900;cursor:pointer;transition:transform .15s,filter .15s}
.color-choice:hover{transform:translateY(-1px);filter:brightness(1.1)}
.color-choice input{accent-color:#fff;margin:0}.swatch{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 6px var(--c)}

/* ============================================================
   ROLL INTRO OVERLAY — no 3D spin
   ============================================================ */
.roll-overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
 opacity:0;visibility:hidden;pointer-events:none;background:radial-gradient(ellipse,rgba(52,7,11,.76),rgba(20,2,5,.42) 65%,transparent)}
.roll-overlay.show{opacity:1;visibility:visible}
.surprise-title{font-size:23px;font-weight:1000;text-align:center;text-shadow:0 4px 10px #000;letter-spacing:.4px;opacity:0;transform:translateY(14px) scale(.95)}
.roll-overlay.show .surprise-title{animation:surpriseTitle .55s cubic-bezier(.16,1,.3,1) forwards}
.surprise-dice{display:flex;justify-content:center;gap:8px;margin-top:14px}
.blank-die{width:58px;height:58px;border-radius:9px;background:#fff;border:2px solid #eee;box-shadow:0 5px 18px #000;
 position:relative;opacity:0;transform:translateY(20px) scale(.82)}
.blank-die:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:7px 7px 0 0;background:var(--c)}
.roll-overlay.show .blank-die{animation:blankEnter .65s cubic-bezier(.16,1.3,.3,1) forwards;animation-delay:var(--delay)}
@keyframes surpriseTitle{to{opacity:1;transform:none}}
@keyframes blankEnter{0%{opacity:0;transform:translateY(20px) scale(.82)}65%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:none}}
.center.rolling-ui .normal{opacity:0;transform:translateY(5px);filter:blur(1px);transition:opacity .32s,transform .32s,filter .32s}
.normal{transition:opacity .38s,transform .38s,filter .38s}

/* ============================================================
   EXTRA VISUAL DETAILS
   ============================================================ */
.glass-line{height:1px;background:linear-gradient(90deg,transparent,rgba(255,120,120,.45),transparent);margin:6px 0}
.small-status{text-align:center;font-size:7px;color:#d5c0c0;opacity:.72;margin-top:6px;letter-spacing:.4px}
.pulse{animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 7px rgba(255,30,30,.12)}50%{box-shadow:0 0 18px rgba(255,30,30,.3)}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:850px){
 .page{width:min(640px,94vw)}.layout{grid-template-columns:minmax(0,430px);justify-content:center}
 .side{display:none}.header{height:78px}.logo{font-size:29px}
}
@media(max-width:460px){
 .page{width:94vw;padding-top:8px}.center{padding:8px 8px 9px}
 .selects{gap:4px}.select{font-size:9px}
 .die,.blank-die{width:53px;height:53px}.dice-stage{gap:5px}
 .color-grid{grid-template-columns:repeat(2,1fr)}
 .title{font-size:17px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

/* ============================================================
   EXTENDED VISUAL SYSTEM
   These classes keep the large single-file build self-contained
   and give the interface more depth without adding advertisements.
   ============================================================ */
.center::after{
 content:"";position:absolute;left:8%;right:8%;top:45px;height:1px;
 background:linear-gradient(90deg,transparent,rgba(255,70,70,.15),rgba(255,170,170,.4),rgba(255,70,70,.15),transparent);
 pointer-events:none
}
.panel::selection,.center::selection{background:#ff3535;color:#fff}
.die.result-pop{animation:resultPop .62s cubic-bezier(.18,1.4,.3,1)}
@keyframes resultPop{
 0%{opacity:.4;transform:translateY(9px) scale(.92);filter:blur(3px)}
 55%{opacity:1;transform:translateY(-3px) scale(1.06);filter:blur(0)}
 100%{opacity:1;transform:none;filter:blur(0)}
}
.die.result-glow{box-shadow:0 3px 10px #000,0 0 22px color-mix(in srgb,var(--die),transparent 12%)}
.streamer.rank-1,.streamer.rank-2,.streamer.rank-3{position:relative}
.streamer.rank-1:after,.streamer.rank-2:after,.streamer.rank-3:after{
 position:absolute;right:5px;bottom:4px;font-size:6px;color:#fff;opacity:.8
}
.streamer.rank-1:after{content:"TOP 1"}.streamer.rank-2:after{content:"TOP 2"}.streamer.rank-3:after{content:"TOP 3"}
.color-choice.active{background:linear-gradient(180deg,rgba(166,43,49,.95),rgba(77,19,25,.95));box-shadow:inset 0 0 12px rgba(255,60,60,.14)}
.color-choice input:checked + .swatch{transform:scale(1.15);box-shadow:0 0 10px var(--c)}
.swatch{transition:transform .18s,box-shadow .18s}
.roll-btn.busy{background:linear-gradient(#e6b900,#c78e00);box-shadow:0 2px 0 #684900,0 0 18px rgba(255,190,0,.28)}
.roll-btn.success{animation:successButton .7s ease}
@keyframes successButton{
 0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}
}
.score-value.bump-up{animation:scoreUp .35s ease}
.score-value.bump-down{animation:scoreDown .35s ease}
@keyframes scoreUp{0%{transform:scale(1);color:#fff}50%{transform:scale(1.25);color:#8dff9c}100%{transform:scale(1);color:#fff}}
@keyframes scoreDown{0%{transform:scale(1);color:#fff}50%{transform:scale(1.25);color:#ff8d8d}100%{transform:scale(1);color:#fff}}
.history-modal{
 position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
 padding:18px;background:rgba(4,0,1,.78);backdrop-filter:blur(7px);
 opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s
}
.history-modal.open{opacity:1;visibility:visible}
.history-card{
 width:min(460px,94vw);max-height:min(620px,88vh);overflow:auto;
 border:2px solid rgba(255,145,145,.62);border-radius:12px;
 background:linear-gradient(180deg,#481016,#22060a);box-shadow:0 20px 70px #000;
 transform:translateY(12px) scale(.97);transition:transform .3s cubic-bezier(.2,1.2,.3,1)
}
.history-modal.open .history-card{transform:none}
.history-head{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid rgba(255,255,255,.2)}
.history-head strong{font-size:15px;text-transform:uppercase}
.history-close{width:29px;height:29px;border:1px solid rgba(255,255,255,.3);border-radius:5px;background:#641c23;color:#fff;font-weight:900}
.history-list{padding:8px}
.history-item{
 display:grid;grid-template-columns:42px 1fr 48px;align-items:center;gap:8px;
 min-height:54px;margin-bottom:6px;padding:6px;border:1px solid rgba(255,150,150,.25);
 border-radius:7px;background:rgba(58,13,18,.8)
}
.history-index{font-size:9px;color:#eababa;text-align:center}
.history-result{font-size:9px;font-weight:900;line-height:16px}
.history-result span{display:inline-flex;align-items:center;gap:3px;margin-right:4px}
.mini-dot{width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 6px var(--c)}
.history-time{font-size:8px;text-align:right;color:#d6c0c0}
.history-empty{text-align:center;padding:30px 12px;color:#d8c1c1;font-size:10px}
.toast{
 position:fixed;left:50%;bottom:24px;z-index:1100;transform:translate(-50%,15px);
 min-width:180px;max-width:90vw;padding:9px 13px;border:1px solid rgba(255,170,170,.45);
 border-radius:6px;background:rgba(37,5,9,.96);box-shadow:0 10px 30px #000;
 font-size:9px;font-weight:900;text-align:center;opacity:0;visibility:hidden;transition:.25s
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.key-hint{font-size:7px;text-align:center;color:#bfa8a8;margin-top:4px;opacity:.7}
.debug-strip{display:none!important}
@media(min-width:851px){
 .center{min-height:520px}
}
@media(max-width:520px){
 .history-item{grid-template-columns:32px 1fr 42px}
 .history-card{max-height:82vh}
}


/* ============================================================
   FINE-GRAINED POLISH — shadows, borders, hover states, timing
   ============================================================ */
.panel{
 isolation:isolate;
}
.side:before,.center:before{
 content:"";position:absolute;pointer-events:none;z-index:-1;
}
.side{
 position:relative;
}
.side:after{
 content:"";position:absolute;left:12px;right:12px;bottom:6px;height:18px;
 background:radial-gradient(ellipse,rgba(255,42,42,.13),transparent 70%);
 filter:blur(7px);pointer-events:none;
}
.streamer:nth-child(1){animation:streamAppear .45s .02s both}
.streamer:nth-child(2){animation:streamAppear .45s .05s both}
.streamer:nth-child(3){animation:streamAppear .45s .08s both}
.streamer:nth-child(4){animation:streamAppear .45s .11s both}

<script>
/* ============================================================
   x1ro Dice application engine
   Everything is intentionally kept in this one index.html.
   No external libraries, ad scripts, trackers, or remote assets.
   ============================================================ */

"use strict";

const COLORS = Object.freeze({
 yellow:{name:"YELLOW",hex:"#ffd400"},
 orange:{name:"ORANGE",hex:"#ff7900"},
 red:{name:"RED",hex:"#ff1717"},
 purple:{name:"PURPLE",hex:"#8f10c7"},
 green:{name:"GREEN",hex:"#18b83d"},
 blue:{name:"BLUE",hex:"#168cff"},
 pink:{name:"PINK",hex:"#ef42a5"},
 cyan:{name:"CYAN",hex:"#13cee8"}
});

const COLOR_KEYS = Object.keys(COLORS);

const STREAMERS = [
 ["ANPRITO","@empitorobiko"],["AVENGER","@epxtrond"],["TIRAMISCGG","@tiramisgg"],
 ["ELSEPRIME59","@elseprime59"],["FREDCX","@fredcx10"],["KAZ","@kazuhiko_muyako"],
 ["EXAMPLE","@exmplv1"],["DEITS GAMING","@deuts_gaming"],["XOSZEN","@twitch.xoszen"],
 ["YAGQVIN","@yagqvin13"],["CHRONOSLOX","@chronos_sab"],["SAUZAUL","@sauzaulz"],
 ["RALATO","@ralatostoreofc"],["NEXO","@nexox041"],["ODBOUO","@odbouq"],
 ["VLX","@sabvlx"],["KEY","@yovek1"],["KFG","@getvex"],["CHROWARBX","@chrowarbx"],["GOJOBTW","@gojobtw"]
];

const state = {
 selectedColors:new Set(COLOR_KEYS),
 diceCount:4,
 score:0,
 rolling:false,
 blur:true,
 sound:false,
 dice:[],
 history:[],
 rollNumber:0,
 mode:"DICE COLOR",
 theme:"HELL RED"
};

const $ = id => document.getElementById(id);

function randomInt(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}

function wait(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function createId(){
 const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
 let result="";
 for(let i=0;i<12;i++) result+=alphabet[randomInt(0,alphabet.length-1)];
 return result;
}

function dotPositions(value){
 const positions={
  1:[1],
  2:[2,3],
  3:[2,1,3],
  4:[2,4,5,3],
  5:[2,4,1,5,3],
  6:[2,4,6,7,5,3]
 };
 return positions[value] || [1];
}

function makeDot(position){
 const dot=document.createElement("i");
 dot.className="dot d"+position;
 dot.setAttribute("aria-hidden","true");
 return dot;
}

function makeDie(colorKey,value){
 const die=document.createElement("div");
 die.className="die";
 die.dataset.color=colorKey;
 die.dataset.value=value;
 die.style.setProperty("--die",COLORS[colorKey].hex);
 die.setAttribute("role","img");
 die.setAttribute("aria-label",`${COLORS[colorKey].name} dice ${value}`);
 dotPositions(value).forEach(position=>die.appendChild(makeDot(position)));
 if(state.blur)die.classList.add("blur");
 return die;
}

function getPool(){
 const selected=[...state.selectedColors];
 if(state.mode==="RANDOM COLOR") return COLOR_KEYS.slice();
 if(state.mode==="FIXED COLOR") return [selected[0]||COLOR_KEYS[0]];
 return selected.length?selected:COLOR_KEYS.slice();
}

function buildDice(keepResults=false){
 const stage=$("diceStage");
 stage.innerHTML="";
 state.dice=[];
 const pool=getPool();

 for(let i=0;i<state.diceCount;i++){
   const old=keepResults && state.dice[i];
   const color=old?old.color:pool[i%pool.length];
   const value=old?old.value:randomInt(1,6);
   const element=makeDie(color,value);
   element.style.opacity="0";
   element.style.transform="translateY(8px) scale(.96)";
   stage.appendChild(element);
   state.dice.push({element,color,value});
   requestAnimationFrame(()=>setTimeout(()=>{
      element.style.opacity="1";
      element.style.transform="none";
   },i*38));
 }
}

function updateDieObject(obj,color,value){
 obj.color=color;
 obj.value=value;
 obj.element.dataset.color=color;
 obj.element.dataset.value=value;
 obj.element.style.setProperty("--die",COLORS[color].hex);
 obj.element.innerHTML="";
 dotPositions(value).forEach(position=>obj.element.appendChild(makeDot(position)));
 obj.element.setAttribute("aria-label",`${COLORS[color].name} dice ${value}`);
 obj.element.classList.toggle("blur",state.blur);
}

function renderColorControls(){
 const grid=$("colorGrid");
 grid.innerHTML="";
 COLOR_KEYS.forEach(key=>{
   const label=document.createElement("label");
   label.className="color-choice";
   label.style.setProperty("--c",COLORS[key].hex);
   const input=document.createElement("input");
   input.type="checkbox";
   input.checked=state.selectedColors.has(key);
   input.dataset.color=key;
   input.setAttribute("aria-label",`Use ${COLORS[key].name}`);
   const sw=document.createElement("span");
   sw.className="swatch";
   label.append(input,sw,document.createTextNode(COLORS[key].name));
   input.addEventListener("change",()=>{
      if(!input.checked && state.selectedColors.size===1){
        input.checked=true;
        flashStatus("At least one color is required");
        return;
      }
      if(input.checked)state.selectedColors.add(key);
      else state.selectedColors.delete(key);
      buildDice();
      saveState();
   });
   grid.appendChild(label);
 });
}

function setBlur(enabled){
 state.blur=enabled;
 state.dice.forEach(obj=>obj.element.classList.toggle("blur",enabled));
 saveState();
}

function flashStatus(text,duration=1200){
 $("status").textContent=text;
 clearTimeout(flashStatus.timer);
 flashStatus.timer=setTimeout(()=>{$("status").textContent="Ready to roll"},duration);
}

function setScore(delta){
 state.score+=delta;
 $("scoreValue").textContent=(state.score>=0?"+":"")+state.score;
 $("scoreValue").animate(
   [{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],
   {duration:220,easing:"ease-out"}
 );
 saveState();
}

function renderStreamers(target,offset){
 const root=$(target);
 root.innerHTML="";
 for(let i=0;i<10;i++){
   const [name,tag]=STREAMERS[(i+offset)%STREAMERS.length];
   const card=document.createElement("div");
   card.className="streamer";
   const avatar=document.createElement("div");
   avatar.className="avatar";
   avatar.setAttribute("aria-hidden","true");
   const info=document.createElement("div");
   info.className="stream-info";
   info.innerHTML=`<div class="stream-name">${name} ✓</div><div class="stream-tag">${tag}</div>`;
   const live=document.createElement("div");
   live.className="live";
   live.textContent="LIVE";
   card.append(avatar,info,live);
   root.appendChild(card);
 }
}

function buildSurprise(){
 const root=$("surpriseDice");
 root.innerHTML="";
 state.dice.forEach((obj,index)=>{
   const blank=document.createElement("div");
   blank.className="blank-die";
   blank.style.setProperty("--c",COLORS[obj.color].hex);
   blank.style.setProperty("--delay",`${index*75}ms`);
   root.appendChild(blank);
 });
}

function playTone(type="click"){
 if(!state.sound)return;
 try{
   const AudioContext=window.AudioContext||window.webkitAudioContext;
   if(!AudioContext)return;
   const ctx=new AudioContext();
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();
   osc.type="sine";
   osc.frequency.value=type==="roll"?180:type==="score"?540:420;
   gain.gain.setValueAtTime(.0001,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.015);
   gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(type==="roll"?.34:.09));
   osc.connect(gain).connect(ctx.destination);
   osc.start();
   osc.stop(ctx.currentTime+(type==="roll"?.36:.11));
   setTimeout(()=>ctx.close(),500);
 }catch(_){}
}

function pushHistory(){
 const result=state.dice.map(d=>({
   color:d.color,value:d.value
 }));
 state.history.unshift({
   id:$("gameId").textContent,
   number:state.rollNumber,
   results:result,
   time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
 });
 state.history=state.history.slice(0,8);
 publishRollForVerify(state.history[0]);
}

function prepareNextResult(){
 const pool=getPool();
 state.dice.forEach(obj=>{
   const color=pool[randomInt(0,pool.length-1)];
   const value=randomInt(1,6);
   updateDieObject(obj,color,value);
 });
 $("gameId").textContent=createId();

async function rollDice(){
 if(state.rolling)return;

 const button=$("rollButton");

 state.dice.forEach((obj,index)=>{
   obj.element.classList.remove("rolling");

 buildSurprise();
 await wait(190);
 center.classList.add("rolling-ui");
 await wait(120);
 overlay.classList.add("show");

   connect to a live service and therefore cannot leak user information.

   Dice result generation is client-side and deterministic only for the
   current displayed state. A production gambling system would require
   server-side verification; this page is a visual dice simulator.

   Animation principles:
   1. Never spin a 3D cube.

   3. Fade the normal card into the surprise state.
   4. Reveal flat white dice sequentially.
   5. Prepare the result before the overlay leaves.
   6. Return the normal card with a soft opacity/position transition.
   7. Give the final dice a short result glow.

   prefers-reduced-motion through the CSS rule above.

 DESIGN
 -------
 The central layout deliberately follows the compact Online Dice composition:
 left streamer column | central game card | right streamer column.

 ROLL TIMELINE
 -------------
 0ms      : button locks and rolling state begins
 0–190ms  : existing dice receive a small vertical/soft motion
 190–310ms : normal interface fades and the overlay starts
 310–1260ms: COLOR ME SURPRISED + flat white dice enter sequentially
 1260–1520 : result is prepared behind the overlay
 1520–1680 : overlay leaves
 1680–2100 : central UI returns smoothly
 2100ms+   : result is settled and history is recorded

 IMPORTANT
 ---------
 The roll intentionally does NOT use a 3D cube rotation. The movement is a restrained
 vertical/scale/blur treatment, matching the flat square transition requested from
 the reference recording.

 BLUR
 ----
 DICE BLUR is independent of rolling. It can be on while the dice are stationary,
 while the roll is starting, and after the result returns. Turning it off immediately
 removes the visual filter from every current die.

 SCORE
 -----
 The four adjustment buttons are real state controls:
 -10, -1, +1, +10.
 The current score is shown in the center and persists through localStorage.

 LOCAL STORAGE
 -------------
 The browser remembers:
 - selected colors
 - dice count
 - score
 - blur setting
 - sound setting
 - recent roll records

 SOUND

 Web Audio API. No sound file is downloaded and no external service is contacted.

 RESPONSIVE
 ----------

 remains usable. The dice and color controls scale down to fit narrow screens.

 ACCESSIBILITY
 -------------
 Controls have labels, focus outlines, live dice descriptions, and keyboard support.
 Space/Enter can start a roll when the page itself has focus. Reduced-motion preferences
 are respected.

 SECURITY / NETWORK
 ------------------
 This document is standalone. It does not fetch remote code, images, ads, tracking
 pixels, or external libraries.

 ROLL BEHAVIOR
 -------------
 The first visible movement is a small settle/jolt. It is followed by a
 soft fade into the surprise overlay. The white squares are not rotating.
 Each square enters with a short vertical overshoot. The result is prepared
 behind the overlay, then the overlay leaves and the normal card returns.

 BLUR BEHAVIOR
 -------------
 Blur is a persistent visual setting, not a roll-only effect. A user can

 The selected color set is used as the roll pool. If a user unchecks a
 color, the current dice can be rebuilt immediately. The last remaining
 color cannot be unchecked, preventing an empty roll pool.

 HISTORY BEHAVIOR
 ----------------
 Each completed roll stores:
     generated game ID
     roll number
     color for each die
     face value for each die
     local completion time
 The history is capped at eight records and stored in localStorage.

 KEYBOARD
 --------
 R = roll
 C = cycle dice count
 H = open history
 ESC = close history
 SPACE / ENTER = roll when the page itself has focus

 PERFORMANCE
 -----------
 The page avoids continuous canvas rendering. Embers use a small number of
 lightweight DOM elements and CSS transforms. Dice use normal DOM nodes.
 Animation uses opacity and transform wherever possible for smooth browser
 compositing. No large external framework is loaded.

 BROWSER FALLBACK
 -----------------
 If color-mix is unavailable, the core dice color still comes from the
 background variable. If Web Audio is unavailable, sound simply does nothing.
 If localStorage is unavailable, the page continues to function for the
 current session.

 FUTURE TUNING POINTS

 The page intentionally keeps these values in one file so visual tuning can
 be done without a framework or compilation step.
